<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard | Secure Blood Bank</title>
  <link rel="stylesheet" href="/ui/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-drop">B+</div>
        <div>
          <div style="font-weight:700;font-size:15px;">Secure Blood Bank</div>
          <div style="font-size:11px;color:#94a3b8;">Physician Portal</div>
        </div>
      </div>
      <nav id="sidebar-nav" class="nav-list"></nav>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-title">Doctor Clinical Workspace</div>
        <div class="topbar-meta">
          <span id="user-meta-pill" class="flex-row"></span>
          <button id="logout-btn" class="btn btn-danger btn-sm">Logout</button>
        </div>
      </header>
      <main id="dashboard-content" class="content"></main>
    </div>
  </div>
  <script type="module">
    import { initDashboard } from "/ui/js/dashboard.js";
    initDashboard("DOCTOR");
  </script>
</body>
</html>
